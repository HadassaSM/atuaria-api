name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -v

  docker:
    runs-on: ubuntu-latest
    needs: testes
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t atuaria-api .
      - name: Sobe o container com PORT customizada e testa
        run: |
          docker run -d -p 10000:10000 -e PORT=10000 --name api atuaria-api
          for i in $(seq 1 20); do curl -fs localhost:10000/ && break; sleep 1; done
          curl -fs -X POST localhost:10000/anuidade -H 'Content-Type: application/json'             -d '{"idade": 60, "taxa_juros": 0.05}'
